<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:440px;height:280px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;position:relative;
 background:radial-gradient(360px 260px at 90% 0%,#2c4fc9 0%,rgba(44,79,201,0) 65%),linear-gradient(135deg,#0d1636,#122255)}
body:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:20px 20px}
.wrap{position:absolute;inset:0;padding:34px 34px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.top svg{width:68px;height:68px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}
h1{font-size:44px;font-weight:800;letter-spacing:-1.2px}
.tag{font-size:22px;line-height:1.3;font-weight:500;color:#d5e0ff;letter-spacing:-.2px}
.bar{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:11px 14px}
.bar code{font:600 15px ui-monospace,"DejaVu Sans Mono",monospace;color:#fff;white-space:nowrap}
.bar i{margin-left:auto;font-style:normal;font-size:13px;font-weight:700;color:#7ee08a}
</style>
<div class="wrap">
 <div class="top"><!--ICON--><h1>Passgen Plus</h1></div>
 <div class="tag">Strong passwords and passphrases, one click.</div>
 <div class="bar"><code>Chutes-Lilies-Future-13</code><i>Strong</i></div>
</div>
